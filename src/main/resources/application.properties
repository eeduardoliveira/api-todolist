# Database Configuration
spring.datasource.url=jdbc:h2:mem:todolist
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Logging Configuration
# Set logging pattern to include timestamp, log level, thread, logger name, and message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %highlight(%-5level) %cyan(%logger{36}) - %msg%n

# Set default logging level
logging.level.root=INFO

# Set application-specific logging level
logging.level.com.example.demo=INFO

# Set framework logging levels (reduce noise)
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.data=WARN

# Enable logging for SQL statements (optional, useful for debugging)
# Uncomment the following lines to see SQL queries
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
